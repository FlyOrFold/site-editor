<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Site Editor · Fly or Fold</title>
  <meta name="description" content="Edit Fly or Fold's sites.csv with a form. Your data stays on this device.">
  <meta name="theme-color" content="#8ec3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07101c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Site Editor">
  <link rel="stylesheet" href="css/editor.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Icons: 16px grid, 1.8 stroke, round caps, matching the site's external-link icon. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-import" viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 11v1.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V11"/></symbol>
      <symbol id="i-export" viewBox="0 0 16 16"><path d="M8 10V2M4.5 5.5 8 2l3.5 3.5M2.5 11v1.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V11"/></symbol>
      <symbol id="i-save" viewBox="0 0 16 16"><path d="M3 2.5h8l2.5 2.5v8a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5ZM5 2.5v3h5v-3M5 13.5V9.5h6v4"/></symbol>
      <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
      <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></symbol>
      <symbol id="i-back" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></symbol>
      <symbol id="i-copy" viewBox="0 0 16 16"><rect x="5.5" y="5.5" width="8" height="8" rx="1"/><path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/></symbol>
      <symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.5 4.5h11M6 4.5V3a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5v1.5M4 4.5l.6 8.6a.5.5 0 0 0 .5.4h5.8a.5.5 0 0 0 .5-.4l.6-8.6"/></symbol>
      <symbol id="i-ext" viewBox="0 0 16 16"><path d="M13 9v4a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M10 2h4v4M14 2 7 9"/></symbol>
      <symbol id="i-undo" viewBox="0 0 16 16"><path d="M5 3 2.5 5.5 5 8M2.5 5.5H10a3.5 3.5 0 0 1 0 7H6"/></symbol>
      <symbol id="i-file" viewBox="0 0 16 16"><path d="M9.5 2H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5.5L9.5 2ZM9.5 2v3.5H13"/></symbol>
      <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></symbol>
    </defs>
  </svg>

  <header class="app-header">
    <div class="bar">
      <a class="brand" href="./" aria-label="Site Editor home">
        <img src="img/logo.svg" alt="" width="32" height="32">
        <span class="brand-name">Fly <span class="or">or</span> Fold</span>
        <span class="brand-app">Site Editor</span>
      </a>
      <label class="file-switch" hidden>
        <span class="visually-hidden">Open file</span>
        <svg class="icon" aria-hidden="true"><use href="#i-file"/></svg>
        <select id="file-select"></select>
      </label>
      <div class="actions">
        <button class="btn secondary" id="import-btn" type="button" title="Import a CSV file" aria-label="Import">
          <svg class="icon" aria-hidden="true"><use href="#i-import"/></svg><span class="label">Import</span>
        </button>
        <button class="btn secondary" id="save-file-btn" type="button" hidden title="Write changes back to the file you imported" aria-label="Save to file">
          <svg class="icon" aria-hidden="true"><use href="#i-save"/></svg><span class="label">Save to file</span>
        </button>
        <button class="btn" id="export-btn" type="button" disabled title="Download the current data as CSV">
          <svg class="icon" aria-hidden="true"><use href="#i-export"/></svg><span class="label">Export</span>
          <span class="count" id="change-count" hidden></span>
        </button>
      </div>
    </div>
  </header>

  <main id="app">
    <!-- No data yet -->
    <section class="welcome" id="welcome" hidden>
      <div class="card welcome-card">
        <svg class="glider" viewBox="0 0 120 90" aria-hidden="true" focusable="false">
          <g class="glider-lines"><path d="M11 34 60 74M30 20 60 74M60 15V74M90 20 60 74M109 34 60 74"/></g>
          <path class="glider-canopy" d="M5 31C22 5 98 5 115 31L108 36C90 15 30 15 12 36Z"/>
          <circle class="glider-pilot" cx="60" cy="77" r="4.5"/>
        </svg>
        <h1>Edit your sites with a form</h1>
        <p class="lede">Import <code>sites.csv</code>, pick a row and edit it as a form. When you are done, export the CSV and commit it to forecast-log.</p>
        <p><button class="btn" type="button" data-action="import">
          <svg class="icon" aria-hidden="true"><use href="#i-import"/></svg>Import a CSV file</button></p>
        <p class="privacy small"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>
          Everything stays on this device. Nothing is uploaded.</p>
      </div>
    </section>

    <div class="workspace" id="workspace" hidden>
      <aside class="list-pane" aria-label="Rows">
        <div class="list-tools">
          <label class="search">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <span class="visually-hidden">Search</span>
            <input type="search" id="search" placeholder="Search" autocomplete="off">
          </label>
          <button class="btn small-btn" type="button" id="new-btn">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span id="new-label">New</span>
          </button>
        </div>
        <p class="list-count small muted" id="list-count" aria-live="polite"></p>
        <ul class="rows" id="rows"></ul>
        <p class="list-foot small">
          <span class="muted" id="file-info"></span>
          <button class="link-btn" type="button" id="remove-file-btn">Remove from this device</button>
        </p>
      </aside>

      <section class="form-pane" aria-label="Edit row">
        <div class="form-empty card empty" id="form-empty">
          <p>Pick a row to edit it, or add a new one.</p>
        </div>
        <form class="record card" id="record" novalidate hidden>
          <div class="record-head">
            <button class="icon-btn back-btn" type="button" id="back-btn" aria-label="Back to the list">
              <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
            </button>
            <div class="record-title">
              <h2 id="record-title"></h2>
              <p class="small muted" id="record-sub"></p>
            </div>
            <span id="record-status"></span>
          </div>
          <div id="record-fields"></div>
          <div class="record-foot">
            <div class="foot-secondary">
              <button class="btn secondary small-btn" type="button" id="duplicate-btn" aria-label="Duplicate" title="Duplicate">
                <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span class="label">Duplicate</span></button>
              <button class="btn secondary small-btn danger" type="button" id="delete-btn" aria-label="Delete" title="Delete">
                <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg><span class="label">Delete</span></button>
            </div>
            <div class="foot-primary">
              <button class="btn secondary" type="button" id="revert-btn" disabled>
                <svg class="icon" aria-hidden="true"><use href="#i-undo"/></svg>Revert</button>
              <button class="btn" type="submit" id="save-btn" disabled>Save</button>
            </div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <dialog id="confirm" class="dialog">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button class="btn secondary" value="cancel">Cancel</button>
        <button class="btn" value="ok" id="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="file-input" accept=".csv,text/csv" hidden>
  <datalist id="tz-list"></datalist>
</body>
</html>
